[package]
name = "rnb"
version = "0.0.2"
edition = "2021"
description = "A terminal-first Notebook editor and runner written in Rust"
license = "GPL-2.0"
repository = "https://github.com/lrisguan/rnb"
readme = "README.md"
keywords = ["jupyter", "notebook", "cli", "tui", "terminal"]
categories = [
    "command-line-utilities",
    "text-editors",
    "development-tools"
]

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tower-lsp = "0.20"
unicode-segmentation = "1.11"
pulldown-cmark = "0.12"
mathlex = "0.3.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratatui-image = { version = "9.0.0", default-features = false, features = ["crossterm"] }
resvg = { version = "0.43", default-features = true }

[dependencies.ratatui]
version = "0.29"
features = ["crossterm", "all-widgets"]

[[bin]]
name = "rnb"
path = "src/main.rs"

